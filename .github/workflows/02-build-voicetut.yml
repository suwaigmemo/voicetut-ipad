
name: 02 - Prepare VoiceTut ONNX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/02-build-voicetut.yml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner information
        run: |
          python --version
          df -h /
          free -h

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install required Python packages
        run: |
          python -m pip install "transformers>=5.3.0" accelerate huggingface_hub safetensors numpy soundfile librosa pydub

      - name: Download OmniVoice source
        run: |
          git clone --depth 1 https://github.com/k2-fsa/OmniVoice.git work
          python -m pip install -e ./work --no-deps

      - name: Download ONNX exporter
        run: |
          git clone --depth 1 https://github.com/AFun9/Omnivoice-onnx.git work/onnx_export

      - name: Download Egyptian VoiceTut model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id="mohammedaly22/VoiceTut-TTS",
              local_dir="work/OmniVoice"
          )

          print("VoiceTut downloaded to:", path)
          PY

      - name: Check VoiceTut files
        run: |
          test -f work/OmniVoice/config.json
          test -f work/OmniVoice/model.safetensors

          echo "VoiceTut checkpoint found"
          du -sh work/OmniVoice
          ls -lh work/OmniVoice | head -40

      - name: Test VoiceTut with ONNX exporter
        run: |
          python - <<'PY'
          import sys
          import torch

          sys.path.insert(0, "work")
          sys.path.insert(0, "work/onnx_export")

          from _common import PT_MODEL_DIR, load_omnivoice

          print("Exporter model directory:", PT_MODEL_DIR)

          model = load_omnivoice(
              torch.device("cpu"),
              dtype=torch.float32
          )

          print("Model type:", type(model).__name__)
          print("Audio vocab size:", model.config.audio_vocab_size)
          print("Audio codebooks:", model.config.num_audio_codebook)
          print("VOICE_TUT_EXPORTER_COMPATIBLE")
          PY

      - name: Success
        run: |
          echo "========================================"
          echo "VOICE_TUT_IPAD_STAGE_2_OK"
          echo "Egyptian VoiceTut checkpoint is ready"
          echo "for the real ONNX export."
          echo "========================================"
