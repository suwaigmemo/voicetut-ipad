name: 04 - Export Audio Tokenizer ONNX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/04-export-audio-tokenizer.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install \
            "transformers>=5.3.0" \
            huggingface_hub \
            safetensors \
            numpy \
            onnx \
            onnxruntime

      - name: Download ONNX exporter
        run: |
          mkdir -p work
          git clone --depth 1 \
            https://github.com/AFun9/Omnivoice-onnx.git \
            work/onnx_export

      - name: Download OmniVoice audio tokenizer
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="k2-fsa/OmniVoice",
              local_dir="work/OmniVoice",
              allow_patterns=["audio_tokenizer/*"]
          )

          print("AUDIO_TOKENIZER_DOWNLOADED")
          PY

      - name: Check tokenizer
        run: |
          test -f work/OmniVoice/audio_tokenizer/model.safetensors
          test -f work/OmniVoice/audio_tokenizer/config.json
          du -sh work/OmniVoice/audio_tokenizer

      - name: Export encoder and decoder
        run: |
          python work/onnx_export/export_audio_tokenizer.py \
            --device cpu \
            --no-optimize

      - name: Quantize encoder and decoder
        run: |
          python work/onnx_export/quantize.py \
            --targets at_encoder,at_decoder \
            --methods int8 \
            --no-smoke

      - name: Prepare package
        run: |
          mkdir -p release

          cp work/onnx_export/output/audio_tokenizer_encoder_int8/model.onnx \
             release/audio-tokenizer-encoder.onnx

          cp work/onnx_export/output/audio_tokenizer_encoder_int8/model.onnx_data \
             release/audio-tokenizer-encoder.onnx_data

          cp work/onnx_export/output/audio_tokenizer_decoder_int8/model.onnx \
             release/audio-tokenizer-decoder.onnx

          cp work/onnx_export/output/audio_tokenizer_decoder_int8/model.onnx_data \
             release/audio-tokenizer-decoder.onnx_data

      - name: Verify files
        run: |
          echo "===== AUDIO TOKENIZER FILES ====="
          ls -lh release/
          echo "VOICE_TUT_AUDIO_TOKENIZER_READY"

      - name: Upload audio tokenizer
        uses: actions/upload-artifact@v4
        with:
          name: voicetut-audio-tokenizer-onnx
          path: release/
          retention-days: 30
          compression-level: 0
